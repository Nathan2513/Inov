<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capstone · Feed bons plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#E8672A; --orange-dk:#C9531B; --orange-soft:#FCE3D2; --orange-50:#FFF4EC;
  --beige:#F6EFE6; --beige-2:#EFE4D6; --sand:#E3D3BF;
  --white:#FFFFFF; --ink:#2B211B; --ink-2:#5B4D42; --muted:#8C7D70; --line:#EADFD2;
  --green:#2E9E5B; --red:#E2552B; --dark:#1F1A17;
  --shadow:0 6px 20px rgba(91,60,30,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% 10%,#FBF6F0 0%,#F1E6D8 55%,#E9DBC8 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none;display:block}

/* ---------- Cadre téléphone ---------- */
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 40px);background:var(--beige);
  border-radius:50px;border:11px solid #1E1814;box-shadow:0 30px 80px rgba(60,35,15,.28);
  overflow:hidden;display:flex;flex-direction:column}
.statusbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 28px 0;font-size:14px;font-weight:700;background:var(--white)}
.sb-icons{display:flex;align-items:center;gap:6px;font-size:12px}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}.sig i{width:3px;background:var(--ink);border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:11px}
.bat{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:4px;padding:1.5px;position:relative}
.bat::after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--ink);border-radius:1px}
.bat i{display:block;height:100%;width:72%;background:var(--ink);border-radius:2px}
@media (max-width:520px){
  body{padding:0;display:block}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}

/* ---------- Barre du haut ---------- */
.topbar{position:relative;flex:none;background:var(--white);padding:10px 14px 12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:15}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo-mark{width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:0 4px 10px rgba(232,103,42,.35)}
.city-wrap{position:relative;margin-left:auto}
.city-btn{display:flex;align-items:center;gap:5px;background:var(--orange-50);border:1.5px solid var(--orange-soft);color:var(--orange-dk);padding:7px 10px 7px 9px;border-radius:999px;font-size:13px;font-weight:700}
.city-btn .ic{width:15px;height:15px}
.city-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:18px;box-shadow:0 14px 34px rgba(60,35,15,.2);padding:6px;min-width:210px;display:none}
.city-menu.show{display:block;animation:fadeIn .15s ease}
.city-menu button{display:flex;width:100%;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700}
.city-menu button:hover{background:var(--beige)}
.city-menu button.on{background:var(--orange-50);color:var(--orange-dk)}
.city-menu small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.city-menu .e{font-size:18px;width:24px;text-align:center}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--beige)}
.icon-btn .ic{width:19px;height:19px}
.count{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}

/* ---------- Zone défilante ---------- */
.scroll{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:110px;scroll-behavior:auto}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar,.page-b::-webkit-scrollbar,.sheet-b::-webkit-scrollbar{display:none}

.savings{margin:12px 14px 2px;background:var(--white);border-radius:18px;padding:11px 12px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow)}
.sv-ic{width:38px;height:38px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center;font-size:19px;flex:none}
.sv-txt{font-size:12.5px;color:var(--ink-2);line-height:1.35;flex:1;min-width:0}
.sv-txt b{color:var(--orange-dk);font-size:14.5px}
.bar{height:5px;background:var(--beige-2);border-radius:5px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#F2A65A,var(--orange));border-radius:5px;transition:width .5s}
.sv-link{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--orange-dk);white-space:nowrap}
.sv-link .ic{width:14px;height:14px}

.stories{display:flex;gap:12px;overflow-x:auto;padding:14px 14px 6px;scrollbar-width:none}
.story{flex:none;width:66px;text-align:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.ring{width:62px;height:62px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,#F2A65A,var(--orange),#B85A2E,#F2A65A);margin:0 auto 5px;display:block}
.ring.seen{background:var(--sand)}
.av-in{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--beige);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;overflow:hidden}
.av-in img{width:100%;height:100%;object-fit:contain;background:#fff}
.story.add .ring{background:none;border:2px dashed var(--orange);padding:3px}
.story.add .av-in{background:var(--orange-50);color:var(--orange);border:0}
.story.add .ic{width:24px;height:24px;stroke-width:2.6}
.lbl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Contrôles (onglets + filtres) ---------- */
.controls{position:sticky;top:0;z-index:6;background:var(--beige);padding:10px 0 8px;transition:transform .25s ease;box-shadow:0 8px 12px -12px rgba(91,60,30,.35)}
.controls.hid{transform:translateY(-110%)}
.seg{margin:0 14px;background:var(--white);border:1.5px solid var(--orange-soft);border-radius:999px;display:flex;padding:4px;position:relative}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);z-index:1;transition:color .2s;text-align:center}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--orange);border-radius:999px;transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:0 4px 10px rgba(232,103,42,.35)}
.seg.right .thumb{transform:translateX(100%)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--white);border:1.5px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 4px 10px rgba(232,103,42,.28)}
.chip.student{border-color:var(--dark)}
.chip.student.on{background:var(--dark);border-color:var(--dark);color:#fff;box-shadow:none}
.chip.big.on{background:linear-gradient(90deg,#F08A3E,var(--red));border-color:transparent}
.chip.sort{padding:6px 10px 6px 11px;gap:4px;margin-left:auto}
.chip.sort .ic{width:15px;height:15px;color:var(--orange-dk)}
.chip.sort select{border:0;background:transparent;font-weight:700;font-size:13px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;padding-right:2px}

/* ---------- Posts ---------- */
.feed{padding:4px 0 0}
.post{background:var(--white);margin:12px 12px 14px;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.post.fresh{animation:fresh 1.8s ease}
@keyframes fresh{0%{box-shadow:0 0 0 3px var(--orange),var(--shadow)}70%{box-shadow:0 0 0 3px var(--orange),var(--shadow)}100%{box-shadow:var(--shadow)}}
.post-head{display:flex;align-items:center;gap:10px;padding:11px 12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;letter-spacing:-.02em;overflow:hidden}
.av img{width:100%;height:100%;object-fit:contain}
.who{min-width:0;flex:1}
.nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.lk{font-weight:700;color:var(--ink-2)}
.open{color:var(--green);font-weight:700}.closed{color:var(--muted);font-weight:600}
.vb{width:15px;height:15px;border-radius:50%;background:var(--orange);display:inline-grid;place-items:center;flex:none}
.vb svg{width:9px;height:9px}
.kind{flex:none;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--orange-50);color:var(--orange-dk);border:1px solid var(--orange-soft);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind.perso{background:var(--beige);color:var(--ink-2);border-color:var(--line)}

.media{position:relative;aspect-ratio:1/1;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:pointer;background:var(--beige-2)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.visual{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px 46px;overflow:hidden}
.visual::before,.visual::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.38)}
.visual::before{width:240px;height:240px;top:-70px;right:-80px}
.visual::after{width:170px;height:170px;bottom:-60px;left:-50px;background:rgba(255,255,255,.26)}
.v-emoji{font-size:100px;line-height:1;filter:drop-shadow(0 14px 18px rgba(120,60,20,.22));position:relative;z-index:1}
.v-title{margin-top:16px;font-size:21px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1;line-height:1.2}
.v-sub{font-size:13px;color:var(--ink-2);margin-top:5px;position:relative;z-index:1}
.v-brand{margin-top:10px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-dk);position:relative;z-index:1}
.v-courses{background:linear-gradient(145deg,#FFF1E4,#F7C9A3)}
.v-mode{background:linear-gradient(145deg,#F8ECE2,#E6C3AA)}
.v-sport{background:linear-gradient(145deg,#FFEEDC,#F3B98A)}
.v-tech{background:linear-gradient(145deg,#F3ECE4,#D8C2AB)}
.v-beaute{background:linear-gradient(145deg,#FDEBE4,#F1BDA9)}
.v-maison{background:linear-gradient(145deg,#F8F0E3,#E5CFAE)}
.m-pct{position:absolute;top:12px;left:12px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;padding:6px 11px;border-radius:12px;z-index:2;box-shadow:0 6px 14px rgba(232,103,42,.35)}
.m-student{position:absolute;top:12px;right:12px;background:var(--dark);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;z-index:2}
.m-bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.m-chip{background:rgba(255,255,255,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:5px}
.m-chip .ic{width:13px;height:13px}
.m-chip.hot{color:var(--red)}
.heart-pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;opacity:0}
.heart-pop .ic{width:100px;height:100px;fill:#fff;stroke:#fff;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.media.pop .heart-pop{animation:pop .85s ease}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.18)}30%{transform:scale(.94)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* Ticket de caisse (posts communauté) */
.receipt-bg{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 1px 1px,rgba(176,137,104,.28) 1px,transparent 0) 0 0/16px 16px,linear-gradient(160deg,#FAF1E6,#EED9C2)}
.receipt{width:70%;background:#fff;padding:18px 16px 20px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:#3a2f28;transform:rotate(-2.5deg);box-shadow:0 16px 30px rgba(90,55,25,.2);position:relative}
.receipt::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 8px,transparent 6px,#fff 6.5px) 0 0/12px 8px repeat-x}
.stamp{position:absolute;top:-16px;right:-16px;width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14px;display:grid;place-items:center;transform:rotate(14deg);box-shadow:0 6px 14px rgba(232,103,42,.4);border:3px dashed rgba(255,255,255,.55)}
.r-store{text-align:center;font-weight:700;letter-spacing:.1em;font-size:12px}
.r-date{text-align:center;color:#8c7d70;font-size:10px;margin:3px 0 10px}
.r-line{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
.r-line .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r-line span:last-child{white-space:nowrap}
.r-line s{color:#b3a394;margin-right:5px}
.r-sep{border-top:1.5px dashed #cbb9a6;margin:9px 0}
.r-total{display:flex;justify-content:space-between;font-weight:700}
.r-saved{margin-top:10px;text-align:center;background:var(--orange-50);border-radius:8px;padding:7px 6px 6px}
.r-saved small{display:block;font-size:9px;letter-spacing:.14em;color:var(--orange-dk);font-weight:700}
.r-saved b{font-family:'Plus Jakarta Sans',sans-serif;font-size:23px;color:var(--orange);letter-spacing:-.02em}

.actions{display:flex;align-items:center;gap:15px;padding:10px 12px 2px 13px}
.act .ic{width:25px;height:25px}
.act.liked .ic{fill:var(--red);stroke:var(--red)}
.act.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3)}100%{transform:scale(1)}}
.save-btn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 13px 8px 11px;border-radius:999px;border:1.5px solid var(--orange);color:var(--orange-dk);font-weight:700;font-size:13px;transition:background .15s}
.save-btn .ic{width:16px;height:16px}
.save-btn.on{background:var(--orange);color:#fff}
.save-btn.on .ic{fill:#fff}
.likes{padding:4px 14px 0;font-weight:700;font-size:13.5px}
.price-row{display:flex;align-items:baseline;gap:8px;padding:6px 14px 0;flex-wrap:wrap}
.price{font-size:25px;font-weight:800;color:var(--orange);letter-spacing:-.02em}
.old{font-size:14px;color:var(--muted);text-decoration:line-through}
.pct{font-size:12px;font-weight:800;color:#fff;background:var(--red);padding:3px 7px;border-radius:7px;align-self:center}
.prod{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-2);max-width:45%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.caption{padding:5px 14px 0;margin:0;font-size:13.5px;line-height:1.45}
.u{font-weight:700;margin-right:2px}
.hashtag{color:var(--orange-dk);font-weight:600}
.hint{margin:8px 14px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.35}
.hint .ic{width:14px;height:14px;color:var(--orange)}
.hint b{color:var(--ink-2);font-weight:700}
.saved-row{margin:8px 14px 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.money{background:var(--orange-50);border:1.5px solid var(--orange-soft);color:var(--orange-dk);font-weight:800;font-size:14px;padding:5px 10px;border-radius:12px}
.verified{font-size:11.5px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:4px;background:#E8F5EC;padding:5px 9px;border-radius:999px}
.verified .ic{width:13px;height:13px;stroke-width:3}
.doc{margin:8px 14px 0;display:inline-flex;align-items:center;gap:6px;background:var(--beige);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600}
.cmt-prev{padding:6px 14px 0;font-size:13px;line-height:1.4}
.view-cmts{display:block;padding:4px 14px 0;font-size:13px;color:var(--muted)}
.ago{padding:5px 14px 14px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.info{margin:10px 14px 0;background:var(--orange-50);border:1.5px solid var(--orange-soft);color:var(--orange-dk);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:40px 28px;color:var(--muted);font-size:13.5px}
.empty .e{font-size:44px;margin-bottom:8px}
.empty b{color:var(--ink);font-size:15px}
.empty p{margin:6px 0 14px}
.btn-sec{border:1.5px solid var(--orange);color:var(--orange-dk);font-weight:700;padding:9px 16px;border-radius:999px;font-size:13px}
.end{text-align:center;padding:14px 30px 10px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ---------- Navigation bas ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;z-index:10}
.nav > button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);width:62px}
.nav > button .ic{width:23px;height:23px}
.nav > button.on{color:var(--orange)}
.nav .plus{width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;margin-top:-28px;box-shadow:0 10px 22px rgba(232,103,42,.45);border:4px solid var(--beige)}
.nav .plus .ic{width:26px;height:26px;stroke-width:2.6}

/* ---------- Chatbot ---------- */
.bot{position:absolute;right:14px;bottom:92px;width:52px;height:52px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(31,26,23,.35);z-index:11}
.bot .ic{width:24px;height:24px;color:#F6A35E}
.bot{transition:transform .25s ease,opacity .25s ease}
.bot.hid{transform:scale(.4);opacity:0;pointer-events:none}
.bot::after{content:'';position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:var(--orange);border:2px solid var(--dark)}
.bot-panel{position:absolute;right:12px;left:12px;bottom:156px;background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(60,35,15,.28);z-index:12;padding:14px;transform-origin:bottom right;transform:scale(.92) translateY(10px);opacity:0;pointer-events:none;transition:.2s ease}
.bot-panel.show{opacity:1;transform:none;pointer-events:auto}
.bp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bp-h .av{width:34px;height:34px;background:var(--dark)}
.bp-h .av .ic{width:18px;height:18px;color:#F6A35E}
.bp-h b{font-size:14.5px;display:block}
.bp-h small{font-size:11.5px;color:var(--green);font-weight:600}
.bp-h .ib{margin-left:auto}
.bp-msgs{max-height:190px;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.msg{background:var(--beige);padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:13px;margin-bottom:8px;max-width:88%;line-height:1.4}
.msg.me{background:var(--orange);color:#fff;margin-left:auto;border-radius:16px 16px 4px 16px}
.bp-sugs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px}
.bp-sugs .chip{padding:7px 11px;font-size:12px}
.bp-form{display:flex;gap:8px}

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);

/* =========================================================
   FILTRES ET TRI
   ========================================================= */
function sortOpts() {
  return S.tab === 'brands'
    ? [['pertinence','Pour toi'],['proche','Plus proches'],['economie','Grosse économie'],['fin','Bientôt fini']]
    : [['pertinence','Pour toi'],['recent','Plus récents'],['proche','Plus proches'],['economie','Grosse économie'],['likes','Plus aimés']];
}
function score(p) {
  if (p.mine) return -1e6;
  return p.ago + (dist(p) || 0) * 2 - pctP(p) * 0.2 - (p.verified ? 3 : 0);
}
const SORTERS = {
  pertinence:(a, b) => score(a) - score(b),
  proche:(a, b) => (dist(a) ?? 0) - (dist(b) ?? 0),
  economie:(a, b) => saving(b) - saving(a),
  fin:(a, b) => a.end - b.end,
  recent:(a, b) => a.ago - b.ago,
  likes:(a, b) => likesOf(b) - likesOf(a)
};
function visible() {
  let list = (S.tab === 'brands' ? OFFERS : POSTS).filter(p => S.city === 'near' || p.city === S.city);
  if (S.cat !== 'Tout') list = list.filter(p => p.cat === S.cat);
  if (S.student) list = list.filter(p => p.student);
  if (S.big) list = list.filter(p => pctP(p) >= 50);
  let fallback = false;
  if (S.city === 'near' && S.pos) {
    const within = list.filter(p => dist(p) <= 25);
    if (within.length) list = within; else fallback = list.length > 0;
  }
  list = [...list].sort(SORTERS[S.sort] || SORTERS.pertinence);
  return { list, fallback };
}

function renderStories() {
  const scope = OFFERS.filter(o => S.city === 'near' || o.city === S.city);
  let keys = [...new Set(scope.map(o => o.brand))];
  if (S.city === 'near') {
    const md = k => Math.min(...scope.filter(o => o.brand === k).map(o => dist(o) ?? 0));
    keys.sort((a, b) => md(a) - md(b));

  $('#stories').innerHTML = `<button class="story add" data-action="publish"><span class="ring"><span class="av-in">${ic('plus')}</span></span><span class="lbl">Publier</span></button>` +
    keys.map(k => {

      const fresh = scope.some(o => o.brand === k && o.ago < 24) && !S.seen.has(k);
      const inner = b.logo ? `<img src="${esc(b.logo)}" alt="">` : esc(b.ini);
      return `<button class="story" data-action="brand" data-brand="${k}"><span class="ring ${fresh ? '' : 'seen'}"><span class="av-in" style="background:${b.color}">${inner}</span></span><span class="lbl">${esc(b.name)}</span></button>`;

/* =========================================================
   SUPERPOSITIONS (feuilles et pages)
   ========================================================= */
const stack = [];
function openOverlay(kind, html, name) {
  const ov = document.createElement('div');
  ov.className = 'ov'; if (name) ov.dataset.name = name;
  ov.innerHTML = kind === 'sheet'
    ? `<div class="backdrop" data-action="close"></div><div class="sheet">${html}</div>`
    : `<div class="page">${html}</div>`;
  $('#layer').appendChild(ov); stack.push(ov);
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('show')));
  return ov;
}
function closeTop() {
  const ov = stack.pop(); if (!ov) return;
  ov.classList.remove('show'); setTimeout(() => ov.remove(), 330);
}
const findOv = name => stack.find(o => o.dataset.name === name);

function tileHTML(p) {

  }
  return p.photo
    ? `<button class="tile" data-action="tile" data-id="${p.id}"><img src="${p.photo}" alt=""><span class="tp">${eur(saving(p))}</span></button>`
    : `<button class="tile t-commu" data-action="tile" data-id="${p.id}">💰 ${eur(saving(p))}<small>${esc(BRANDS[p.brand].name)}</small></button>`;
}
function openBrand(k) {
  const b = BRANDS[k]; if (!b) return;
  S.seen.add(k); renderStories();
  const offers = OFFERS.filter(o => o.brand === k);
  const scope = offers.filter(o => S.city === 'near' || o.city === S.city);
  const storesSrc = scope.length ? scope : offers;
  const seenP = new Set();
  const stores = storesSrc.filter(o => { const key = o.city + o.place; if (seenP.has(key)) return false; seenP.add(key); return true; })
    .map(o => ({ o, d: dist(o) })).sort((a, c) => (a.d ?? 0) - (c.d ?? 0));
  const posts = POSTS.filter(p => p.brand === k);
  const avg = offers.length ? offers.reduce((s, o) => s + saving(o), 0) / offers.length : 0;
  const f = S.follow.has(k);
  const cityTxt = S.city === 'near' ? 'autour de toi' : (scope.length ? 'à ' + S.city : '');
  openOverlay('page', `
    <div class="page-h"><button class="ib" data-action="close" aria-label="Retour">${ic('back')}</button><h3>${esc(b.name)}</h3></div>
    <div class="page-b">
      <div class="prof">
        <div class="prof-top">${avBrand(b, 'big')}
          <div class="stats"><div><b>${offers.length}</b><span>offres</span></div><div><b id="folN">${fmtK(b.followers + (f ? 1 : 0))}</b><span>abonnés</span></div><div><b>${eur(avg)}</b><span>éco. moy.</span></div></div>
        </div>
        <h4>${esc(b.name)} ${b.custom ? '' : VB}</h4>
        <p>${esc(b.bio)}</p>
        <div class="prof-btns">
          <button class="btn-main ${f ? 'on' : ''}" data-action="follow" data-brand="${k}">${f ? 'Abonné ✓' : 'Suivre'}</button>
          <button class="btn-out" data-action="nav" data-nav="carte">📍 Voir sur la carte</button>
        </div>
      </div>
      ${stores.length ? `<div class="sec-t">Magasins ${cityTxt}</div><div class="stores">${stores.map(({ o, d }) => {
        const op = isOpen(o.hours);
        return `<div class="store-row"><span style="font-size:20px">🏪</span><div><b>${esc(b.name)} ${esc(o.place)}</b><small><span class="${op ? 'open' : 'closed'}">${op ? 'Ouvert' : 'Fermé'}</span> · ${fmtH(o.hours[0])} - ${fmtH(o.hours[1])}</small></div><span class="d">${kmTxt(d)}</span></div>`;
      }).join('')}</div>` : ''}
      <div class="sec-t">Offres en cours</div>
      <div class="grid">${offers.map(tileHTML).join('') || '<p style="grid-column:1/-1;color:var(--muted);font-size:13px">Aucune offre pour le moment.</p>'}</div>
      ${posts.length ? `<div class="sec-t">La communauté en parle</div><div class="grid">${posts.map(tileHTML).join('')}</div>` : ''}
    </div>`, 'brand');
}

   ========================================================= */
let P = null;
const EMOJIS = ['🛒','🥑','🥐','🍕','🍝','☕','👕','👟','🎧','💻','💄','🧴','🛋️','📦','💡','🎁'];
const MOODS = ['🔥 Pépite','🛒 Courses malines','🎓 Spécial étudiant','🌱 Anti-gaspi','🍕 Soirée colocs','✨ Déco'];
const DURS = [[0,"Aujourd'hui"],[3,'3 jours'],[7,'1 semaine'],[14,'2 semaines'],[30,'1 mois']];

function openPublish() {
  P = { role:null, city: S.city === 'Paris' ? 'Paris' : 'Lille', cat:'Courses', mood:'🔥 Pépite', dur:7, student:false, stock:false, verify:true, file:null, emoji:null, v:{} };
  const ov = openOverlay('page', `
    <div class="page-h"><button class="ib" data-action="close" aria-label="Fermer">${ic('x')}</button><h3>Publier un bon plan</h3></div>
    <div class="page-b pub-b" id="pubBody"></div>
    <div class="pub-foot"><div class="pub-err" id="pubErr"></div><button class="btn-primary" id="pubBtn" data-action="pubsend" disabled>Publier</button></div>`, 'publish');
  ov.addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f) return;
    P.v[f] = e.target.value;
    if (f === 'brand') drawPub(); else updatePub();
  });
  ov.addEventListener('change', e => { if (e.target.id === 'pubFile') readFile(e.target.files[0]); });
  drawPub();
}
const fld = (label, inner) => `<div class="field"><label>${label}</label>${inner}</div>`;
const inp = (f, ph, extra = '') => `<input class="inp" data-f="${f}" type="text" placeholder="${esc(ph)}" value="${esc(P.v[f] || '')}" ${extra}>`;
const area = (f, ph) => `<textarea class="inp" data-f="${f}" placeholder="${esc(ph)}" maxlength="400">${esc(P.v[f] || '')}</textarea>`;
const pick = (k, list) => `<div class="pick">${list.map(([v, l]) => `<button class="chip ${String(P[k]) === String(v) ? 'on' : ''}" data-action="pset" data-k="${k}" data-v="${esc(v)}">${l}</button>`).join('')}</div>`;
const tgl = (k, title, sub) => `<button class="toggle-row" data-action="pset" data-k="${k}" data-v="toggle"><span>${title}${sub ? `<small>${sub}</small>` : ''}</span><span class="switch ${P[k] ? 'on' : ''}"></span></button>`;

function drawPub() {
  const body = $('#pubBody'); if (!body || !P) return;
  const v = P.v, pro = P.role === 'pro';
  const role = (r, e, t, s) => `<button class="role ${P.role === r ? 'on' : ''}" data-action="pset" data-k="role" data-v="${r}"><span class="role-ic">${e}</span><span><b>${t}</b><small>${s}</small></span><span class="radio"></span></button>`;
  let h = `<p class="pub-q">Tu publies en tant que…</p>
    ${role('pro','🏪','Commerçant','Publie une offre officielle pour ton magasin')}
    ${role('perso','🙋','Particulier','Partage un bon plan que tu as trouvé')}`;
  if (P.role) {
    const opts = Object.values(BRANDS).map(b => `<option value="${b.key}" ${v.brand === b.key ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
    const file = P.file;
    const dz = `<label class="dz ${file ? 'has' : ''}"><input type="file" id="pubFile" accept="image/*,application/pdf" hidden>
      ${file && file.kind === 'img' ? `<img src="${file.url}" alt=""><div style="margin-top:8px">Appuie pour changer d'image</div>`
        : file ? `📄 <b>${esc(file.name)}</b><div>Document ajouté · appuie pour changer</div>`
        : `${ic('upload')}<b>${pro ? 'Ajoute une photo ou un document' : 'Ajoute une photo ou ton ticket de caisse'}</b><div>JPG, PNG ou PDF</div>`}</label>`;
    h += `<div class="divider"></div>
      ${fld('Enseigne', `<select class="inp" data-f="brand"><option value="">Choisir une enseigne…</option>${opts}<option value="__other" ${v.brand === '__other' ? 'selected' : ''}>${pro ? 'Mon commerce n\'est pas dans la liste' : 'Autre enseigne…'}</option></select>`)}
      ${v.brand === '__other' ? fld(pro ? 'Nom de ton commerce' : "Nom de l'enseigne", inp('other', 'ex. Boulangerie du Marché')) : ''}
      <div class="row2">${fld('Ville', pick('city', [['Lille','Lille'],['Paris','Paris']]))}${fld('Magasin', inp('place', 'ex. Wazemmes'))}</div>
      ${fld(pro ? 'Produit en promo' : "Ce que tu as acheté", inp('product', pro ? 'ex. Avocats mûrs à point' : 'ex. Courses de la semaine'))}
      ${pro ? fld('Précision (optionnel)', inp('detail', 'ex. Filet de 4, 250 g…')) : ''}
      ${fld('Catégorie', pick('cat', CATS.slice(1).map(([c, e]) => [c, e + ' ' + c])))}
      <div class="row2">
        ${fld(pro ? 'Prix initial (€)' : 'Prix normal (€)', inp('old', '2,99', 'inputmode="decimal"'))}
        ${fld(pro ? 'Prix réduit (€)' : 'Prix payé (€)', inp('price', '1,79', 'inputmode="decimal"'))}
      </div>
      <div class="calc idle" id="pubCalc"></div>
      ${pro ? fld("Durée de l'offre", pick('dur', DURS)) : fld('Ton humeur', pick('mood', MOODS.map(m => [m, m])))}
      ${pro ? tgl('student', '🎓 Prix étudiant', 'Réservé sur présentation de la carte étudiante') + tgl('stock', '📦 Stock limité', 'Affiche le nombre de pièces restantes') + (P.stock ? fld('Pièces disponibles', inp('stockN', 'ex. 20', 'inputmode="numeric"')) : '') : ''}
      ${fld(pro ? 'Description' : 'Raconte ton bon plan', area('desc', pro ? "Ce qu'il faut savoir sur l'offre…" : "J'ai réussi à économiser… grâce à…"))}
      ${fld('Hashtags', inp('tags', '#antigaspi #etudiant'))}
      ${!file || file.kind !== 'img' ? `<div class="field"><span class="flabel">Visuel du post (si pas de photo)</span><div class="emo-pick">${EMOJIS.map(e => `<button class="${(P.emoji || CAT_EMOJI[P.cat]) === e ? 'on' : ''}" data-action="pset" data-k="emoji" data-v="${e}">${e}</button>`).join('')}</div></div>` : ''}
      ${fld(pro ? 'Photo ou document' : 'Photo ou ticket de caisse', dz)}
      ${pro ? '' : tgl('verify', '✅ Vérifier mon économie avec Linxo', 'Ajoute le badge « Économie vérifiée » à ton post')}`;
  }
  body.innerHTML = h;
  updatePub();
}
function pubCheck() {
  const v = P.v, old = toNum(v.old), price = toNum(v.price), miss = [];
  if (!P.role) return { old, price, ok:false, miss:['ton profil (commerçant ou particulier)'] };
  if (!v.brand || (v.brand === '__other' && !(v.other || '').trim())) miss.push('enseigne');
  if (!(v.place || '').trim()) miss.push('magasin');
  if (!(v.product || '').trim()) miss.push('produit');
  if (!(old > 0) || !(price >= 0) || price >= old) miss.push('prix');
  return { old, price, ok: !miss.length, miss };
}
function updatePub() {
  if (!P) return;
  const { old, price, ok, miss } = pubCheck();
  const c = $('#pubCalc');
  if (c) {
    if (old > 0 && price >= 0 && !isNaN(price) && price < old) {
      c.className = 'calc';
      c.textContent = P.role === 'pro'
        ? `Réduction de -${pctOf(old, price)} % · ${eur(old - price)} d'économie par client`
        : `🎉 Tu as économisé ${eur(old - price)} (-${pctOf(old, price)} %)`;
    } else if (old > 0 && price >= old) {
      c.className = 'calc warn'; c.textContent = 'Le prix réduit doit être inférieur au prix initial.';
    } else {
      c.className = 'calc idle'; c.textContent = "Renseigne les deux prix pour calculer l'économie.";
    }
  }
  $('#pubBtn').disabled = !ok;
  $('#pubErr').textContent = ok ? 'Tout est bon, ton post est prêt ✨' : 'Il manque : ' + miss.join(', ');
}
function readFile(f) {
  if (!f || !P) return;
  if (f.type.startsWith('image/')) {
    const r = new FileReader();
    r.onload = () => { P.file = { kind:'img', url:r.result, name:f.name }; drawPub(); };
    r.readAsDataURL(f);
  } else { P.file = { kind:'doc', name:f.name }; drawPub(); }
}
function createBrand(name, cat) {
  const key = 'x' + Date.now();
  BRANDS[key] = { key, name, ini: initials(name), logo:'', color: PALETTE[hash(name) % PALETTE.length], followers: 0, custom: true,
    bio: `Commerce ${cat ? cat.toLowerCase() + ' ' : ''}présent sur Capstone.` };
  return key;
}
function publishPost() {
  const { old, price, ok } = pubCheck(); if (!ok) return;
  const v = P.v, pro = P.role === 'pro';
  let bk = v.brand; if (bk === '__other') bk = createBrand(v.other.trim(), P.cat);
  const r = CITY_REF[P.city];
  const lat = r.lat + (Math.random() - .5) * .02, lng = r.lng + (Math.random() - .5) * .03;
  const tags = (v.tags || '').split(/[\s,]+/).map(t => t.replace(/^#/, '')).filter(Boolean).slice(0, 5);
  const photo = P.file && P.file.kind === 'img' ? P.file.url : null;
  const doc = P.file && P.file.kind === 'doc' ? { name: P.file.name } : null;
  let item;
  if (pro) {
    item = offer(bk, P.city, v.place.trim(), lat, lng, P.cat, v.product.trim(), (v.detail || '').trim(), P.emoji || CAT_EMOJI[P.cat], old, price, P.dur,
      { student:P.student, stock: P.stock ? Math.max(1, parseInt(v.stockN) || 10) : 0, hours:[8, 21], likes:0, ago:0,
        caption: (v.desc || '').trim() || `Nouvelle offre chez ${BRANDS[bk].name} !`, tags });
    OFFERS.unshift(item); S.tab = 'brands';
  } else {
    item = post(ME, P.city, bk, v.place.trim(), lat, lng, P.cat, P.mood, price, old,
      { verified:P.verify, likes:0, ago:0, item: v.product.trim(), text: (v.desc || '').trim() || `Bon plan trouvé chez ${BRANDS[bk].name} 🙌`, tags });
    POSTS.unshift(item); S.tab = 'community'; S.monthSaved += old - price;
  }
  item.photo = photo; item.doc = doc; item.mine = true; item.fresh = true;
  if (S.city !== 'near') S.city = P.city;
  S.cat = 'Tout'; S.student = false; S.big = false; S.sort = 'pertinence';
  P = null;
  closeTop(); render(); scrollToFeed(true);
  toast(pro ? '🎉 Ton offre est en ligne' : '🎉 Ton bon plan est partagé avec la communauté');
}

/* =========================================================
   LOCALISATION
   ========================================================= */
function locate() {
  toast('📍 Recherche de ta position…');
  const done = (pos, simulated) => {
    S.pos = pos; S.city = 'near'; S.sort = 'proche'; render();
    toast(simulated ? '📍 Position simulée : Lille centre' : '📍 Voici les bons plans autour de toi');
  };
  const fallback = () => done({ lat:50.6330, lng:3.0590 }, true);
  if (!navigator.geolocation) return fallback();
  navigator.geolocation.getCurrentPosition(p => done({ lat:p.coords.latitude, lng:p.coords.longitude }), fallback, { timeout:6000, maximumAge:600000 });
}

/* =========================================================
   ASSISTANT
   ========================================================= */
function botSay(text, me) {
  const box = $('#botMsgs'), m = document.createElement('div');
  m.className = 'msg' + (me ? ' me' : ''); m.textContent = text;
  box.appendChild(m); box.scrollTop = box.scrollHeight;
}
function closeBotSoon() { setTimeout(() => $('#botPanel').classList.remove('show'), 1300); }
function botQuery(raw) {
  botSay(raw, true);
  const q = norm(raw);
  if (/proche|pres de moi|autour/.test(q)) { botSay('Je cherche les bons plans autour de toi 📍'); closeBotSoon(); setTimeout(locate, 500); return; }
  S.cat = 'Tout'; S.student = false; S.big = false;
  const applied = [];
  const catMap = { course:'Courses', supermarche:'Courses', manger:'Courses', mode:'Mode', vetement:'Mode', sport:'Sport', running:'Sport', tech:'Tech', casque:'Tech', beaute:'Beauté', maquillage:'Beauté', maison:'Maison', deco:'Maison' };
  for (const [k, c] of Object.entries(catMap)) if (q.includes(k)) { S.cat = c; applied.push(c); break; }
  if (/etudiant/.test(q)) { S.student = true; applied.push('prix étudiant'); }
  if (/50|moitie|grosse|enorme/.test(q)) { S.big = true; applied.push('-50 % et +'); }
  if (/paris/.test(q)) { S.city = 'Paris'; applied.push('Paris'); } else if (/lille/.test(q)) { S.city = 'Lille'; applied.push('Lille'); }
  if (/communaute|gens|avis/.test(q)) S.tab = 'community';
  const bk = Object.keys(BRANDS).find(k => q.includes(k) || q.includes(norm(BRANDS[k].name)));
  if (bk && !applied.length) {
    botSay(`J'ouvre la page ${BRANDS[bk].name} 👇`);
    setTimeout(() => { $('#botPanel').classList.remove('show'); openBrand(bk); }, 700); return;
  }
  if (!applied.length) { botSay("Je n'ai pas bien compris 🤔 Essaie par exemple « courses pas chères » ou « offres prix étudiant »."); return; }
  if (!sortOpts().some(o => o[0] === S.sort)) S.sort = 'pertinence';
  render();
  const n = visible().list.length;
  setTimeout(() => {
    botSay(n ? `J'ai trouvé ${n} bon${n > 1 ? 's' : ''} plan${n > 1 ? 's' : ''} (${applied.join(', ')}) 👇` : `Aucun bon plan pour l'instant avec : ${applied.join(', ')}.`);
    closeBotSoon(); scrollToFeed();
  }, 450);
}

/* =========================================================
   ACTIONS
   ========================================================= */
function scrollToFeed(instant) {
  const sc = $('#scroll'), a = $('#ctrlAnchor').offsetTop;
  $('#controls').classList.remove('hid');
  if (sc.scrollTop > a) sc.scrollTo({ top:a, behavior: instant ? 'auto' : 'smooth' });
}
function popHeart(id) {
  $$(`[data-post="${id}"] .media`).forEach(m => { m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); });
}
function toggleLike(id, forceOn) {
  if (S.liked.has(id) && !forceOn) S.liked.delete(id); else S.liked.add(id);
  rerender(id);
  if (S.liked.has(id)) $$(`[data-post="${id}"] .act[data-action="like"]`).forEach(b => b.classList.add('bump'));
}
let lastTap = { id:null, t:0 };
const NAV_NAMES = { carte:'Carte des bons plans', budget:'Budget', profil:'Profil' };

const A = {
  city: () => $('#cityMenu').classList.toggle('show'),
  setcity: t => {
    $('#cityMenu').classList.remove('show');
    const c = t.dataset.city;
    if (c === 'near') return locate();
    S.city = c; if (S.sort === 'proche') S.sort = 'pertinence';
    render(); scrollToFeed(); toast(`📍 Bons plans à ${c}`);
  },
  tab: t => {
    if (S.tab === t.dataset.tab) return;
    S.tab = t.dataset.tab;
    if (!sortOpts().some(o => o[0] === S.sort)) S.sort = 'pertinence';
    renderControls(); renderFeed(); scrollToFeed();
  },
  cat: t => { S.cat = t.dataset.cat; renderControls(); renderFeed(); scrollToFeed(); },
  student: () => { S.student = !S.student; renderControls(); renderFeed(); },
  big: () => { S.big = !S.big; renderControls(); renderFeed(); },
  reset: () => { S.cat = 'Tout'; S.student = false; S.big = false; renderControls(); renderFeed(); },
  like: t => toggleLike(t.dataset.id),
  media: t => {
    const id = t.dataset.id, n = Date.now();
    if (lastTap.id === id && n - lastTap.t < 350) {
      if (!S.liked.has(id)) toggleLike(id, true);
      popHeart(id); lastTap = { id:null, t:0 };
    } else lastTap = { id, t:n };
  },
  comments: t => openComments(t.dataset.id),
  emo: t => { const i = $('.cmt-input input'); if (i) { i.value += t.dataset.e; i.focus(); } },
  share: t => {
    const p = get(t.dataset.id), b = BRANDS[p.brand];
    const txt = p.type === 'brand' ? `Bon plan Capstone : ${p.product} à ${eur(p.price)} au lieu de ${eur(p.old)} chez ${b.name} ${p.place}` : `Bon plan Capstone : ${p.user} a économisé ${eur(saving(p))} chez ${b.name}`;
    try { navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
    toast('🔗 Lien du bon plan copié, partage-le à tes amis');
  },
  save: t => {
    const id = t.dataset.id, p = get(id);
    if (S.saved.has(id)) { S.saved.delete(id); toast('Retiré de tes bons plans'); }
    else {
      S.saved.add(id);
      toast(p.type === 'brand' ? `🔖 Sauvegardé · jusqu'à ${eur(saving(p))} en moins sur ton budget ${p.cat}` : '🔖 Bon plan sauvegardé');
    }
    rerender(id); renderTop(); refreshSaved();
  },
  saved: () => openOverlay('sheet', savedHTML(), 'saved'),
  brand: t => openBrand(t.dataset.brand),
  user: t => openUser(t.dataset.user),
  tile: t => openPostDetail(t.dataset.id),
  follow: t => {
    const k = t.dataset.brand, b = BRANDS[k];
    if (S.follow.has(k)) S.follow.delete(k); else { S.follow.add(k); toast(`Tu suis ${b.name}, tu verras ses offres en priorité`); }
    const f = S.follow.has(k);
    t.classList.toggle('on', f); t.textContent = f ? 'Abonné ✓' : 'Suivre';
    const n = $('#folN'); if (n) n.textContent = fmtK(b.followers + (f ? 1 : 0));
  },
  followu: t => {
    const u = t.dataset.user;
    if (S.followU.has(u)) S.followU.delete(u); else S.followU.add(u);
    const f = S.followU.has(u);
    t.classList.toggle('on', f); t.textContent = f ? 'Abonné ✓' : 'Suivre';
    const n = $('#folU'); if (n) n.textContent = 90 + hash(u) % 900 + (f ? 1 : 0);
  },
  publish: () => openPublish(),
  pset: t => {
    const k = t.dataset.k, v = t.dataset.v;
    if (v === 'toggle') P[k] = !P[k];
    else P[k] = k === 'dur' ? +v : v;
    drawPub();
  },
  pubsend: () => publishPost(),
  close: () => closeTop(),
  top: () => { while (stack.length) closeTop(); $('#scroll').scrollTo({ top:0, behavior:'smooth' }); },
  nav: t => {
    const k = t.dataset.nav, href = NAV_LINKS[k];
    if (!href) return toast(`La page ${NAV_NAMES[k] || k} arrive bientôt`);
    /* Dans l'appli complète (iframe) : on demande à index.html de changer d'écran */
    if (window.parent !== window) { window.parent.postMessage({ go: k }, '*'); return; }
    location.href = href;
  },
  bot: () => $('#botPanel').classList.toggle('show'),
  botsug: t => botQuery(t.textContent.replace(/^\S+\s/, ''))
};

/* =========================================================
   ÉCOUTEURS
   ========================================================= */
document.addEventListener('click', e => {
  if (!e.target.closest('.city-wrap')) $('#cityMenu').classList.remove('show');
  const t = e.target.closest('[data-action]'); if (!t) return;
  const f = A[t.dataset.action]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sort') { S.sort = e.target.value; renderFeed(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.classList.contains('cmt-input')) addComment(f);
  if (f.id === 'botForm') { const i = f.querySelector('input'), v = i.value.trim(); if (v) { i.value = ''; botQuery(v); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTop(); });

/* Défilement horizontal à la souris (ordinateur) */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('.hs'); if (!el || e.target.closest('select')) return;
  drag = { el, x:e.clientX, s:el.scrollLeft, moved:false };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 5) drag.moved = true;
  if (drag.moved) drag.el.scrollLeft = drag.s - dx;
});
document.addEventListener('pointerup', () => {
  if (drag && drag.moved) {
    const el = drag.el, block = ev => { ev.stopPropagation(); ev.preventDefault(); };
    el.addEventListener('click', block, { capture:true, once:true });
    setTimeout(() => el.removeEventListener('click', block, { capture:true }), 60);
  }
  drag = null;
});

/* Filtres qui se cachent en descendant, réapparaissent en remontant */
let lastY = 0;
$('#scroll').addEventListener('scroll', () => {
  const y = $('#scroll').scrollTop, a = $('#ctrlAnchor').offsetTop, c = $('#controls');
  const bot = $('.bot'), open = $('#botPanel').classList.contains('show');
  if (y > a + 80 && y > lastY + 6) { c.classList.add('hid'); if (!open) bot.classList.add('hid'); }
  else if (y < lastY - 6 || y <= a) { c.classList.remove('hid'); bot.classList.remove('hid'); }
  lastY = y;
}, { passive:true });

/* =========================================================
   INITIALISATION
   ========================================================= */
$$('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
function tick() { const d = new Date(); $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setInterval(tick, 30000);
botSay("Salut 👋 Je suis l'assistant Capstone. Dis-moi ce que tu cherches et je filtre le feed pour toi.");
render();
</script>
</body>
