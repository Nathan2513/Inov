<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte Bons Plans</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --beige:#F6EFE4;
    --beige-2:#EADFCC;
    --white:#FFFFFF;
    --orange:#F2711C;
    --orange-dark:#D85F0C;
    --orange-soft:#FDE6D5;
    --text:#3A2E22;
    --muted:#8C7B68;
    --line:#E3D6C2;
    --green:#2E9E5B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);background:var(--beige);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- Cadre téléphone ---------- */
  .app{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;background:var(--beige);overflow:hidden}
  @media (min-width:520px){
    body{display:flex;align-items:center;justify-content:center;background:var(--beige-2)}
    .app{width:390px;height:min(844px, calc(100dvh - 40px));border-radius:42px;box-shadow:0 30px 60px rgba(58,46,34,.25),0 0 0 10px #2b221a}
  }

  /* ---------- Header ---------- */
  .header{background:var(--beige);padding:14px 14px 10px;z-index:20;display:flex;flex-direction:column;gap:10px}
  .search{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:14px;padding:8px 10px;box-shadow:0 4px 14px rgba(58,46,34,.10)}
  .logo{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
  .search input{flex:1;border:none;outline:none;font:inherit;font-size:15px;color:var(--text);background:transparent;min-width:0}
  .search input::placeholder{color:var(--muted)}
  .search .clear{display:none;width:26px;height:26px;border-radius:50%;background:var(--beige);font-size:14px;color:var(--muted)}
  .search.has-text .clear{display:block}

  .seg{display:flex;border:1.5px solid var(--orange);border-radius:26px;padding:3px;background:var(--white)}
  .seg button{flex:1;padding:7px 2px;border-radius:22px;font-size:12.5px;font-weight:600;color:var(--orange-dark);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s}
  .seg button.active{background:var(--orange);color:#fff}

  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1.5px solid var(--text);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;background:var(--white);display:flex;align-items:center;gap:6px;transition:.15s}
  .chip.active{background:var(--text);color:#fff}
  .chip .badge{background:var(--orange);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;display:none}
  .chip .badge.show{display:inline-block}

  /* ---------- Carte ---------- */
  .map-wrap{position:relative;flex:1;min-height:0}
  #map{position:absolute;inset:0;background:#efe7da}
  .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)!important}

  .toggle{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:500;display:flex;background:var(--white);border:2px solid var(--orange);border-radius:26px;box-shadow:0 4px 12px rgba(58,46,34,.15)}
  .toggle button{padding:7px 20px;border-radius:22px;font-weight:700;font-size:15px;color:var(--orange-dark)}
  .toggle button.active{background:var(--orange);color:#fff}

  .locate{position:absolute;left:14px;bottom:78px;z-index:500;width:50px;height:50px;border-radius:50%;background:var(--white);box-shadow:0 4px 12px rgba(58,46,34,.18);display:grid;place-items:center}

  /* Marqueurs prix */
  .pin{position:absolute;transform:translate(-50%,-100%);background:var(--white);border-radius:10px;padding:5px 9px 5px;box-shadow:0 3px 10px rgba(58,46,34,.22);display:flex;flex-direction:column;align-items:center;line-height:1.1;white-space:nowrap;transition:transform .15s}
  .pin::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--white);border-bottom:0}
  .pin .pp{color:var(--orange-dark);font-weight:800;font-size:14px}
  .pin .pd{font-size:10px;font-weight:700;color:var(--muted)}
  .pin.sel{background:var(--orange);transform:translate(-50%,-100%) scale(1.12);z-index:1000}
  .pin.sel::after{border-top-color:var(--orange)}
  .pin.sel .pp,.pin.sel .pd{color:#fff}
  .me-dot{width:16px;height:16px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 6px rgba(242,113,28,.25)}

  /* Fiche offre */
  .card{position:absolute;left:12px;right:12px;bottom:72px;z-index:600;background:var(--white);border-radius:18px;padding:14px;box-shadow:0 10px 28px rgba(58,46,34,.25);transform:translateY(130%);transition:transform .25s ease}
  .card.show{transform:translateY(0)}
  .card-top{display:flex;gap:12px;align-items:center}
  .store-ico{width:46px;height:46px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .card h3{font-size:16px;font-weight:800}
  .card .store{font-size:12.5px;color:var(--muted);font-weight:600}
  .card .close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--beige);font-size:14px}
  .price-row{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px}
  .price-row .now{font-size:24px;font-weight:800;color:var(--orange-dark)}
  .price-row .old{font-size:14px;color:var(--muted);text-decoration:line-through}
  .price-row .pct{margin-left:auto;background:var(--orange);color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:3px 8px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{font-size:11.5px;font-weight:600;background:var(--beige);border-radius:8px;padding:4px 8px}
  .tag.green{background:#E2F3E8;color:var(--green)}
  .tag.red{background:#FCE3D6;color:var(--orange-dark)}
  .card-actions{display:flex;gap:8px}
  .btn{flex:1;padding:11px;border-radius:12px;font-weight:700;font-size:14px;text-align:center}
  .btn.primary{background:var(--orange);color:#fff}
  .btn.ghost{background:var(--beige);flex:0 0 52px;font-size:18px}
  .btn.ghost.saved{background:var(--orange-soft)}

  /* Sheet "Offres du moment" */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:550;background:var(--white);border-radius:24px 24px 0 0;padding:6px 0 12px;text-align:center;box-shadow:0 -6px 18px rgba(58,46,34,.10);width:100%}
  .sheet .grab{display:block;margin:0 auto 2px;width:18px;height:18px}
  .sheet strong{font-size:18px;font-weight:800}
  .sheet span{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}

  /* Vue liste */
  .list{position:absolute;inset:0;z-index:520;background:var(--beige);overflow-y:auto;padding:64px 12px 80px;display:none}
  .list.show{display:block}
  .list-title{font-size:13px;font-weight:700;color:var(--muted);margin:2px 4px 10px}
  .item{display:flex;gap:12px;align-items:center;background:var(--white);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(58,46,34,.06);width:100%;text-align:left}
  .item .info{flex:1;min-width:0}
  .item .info b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .info small{font-size:12px;color:var(--muted);font-weight:600}
  .item .right{text-align:right}
  .item .right .now{display:block;font-weight:800;color:var(--orange-dark);font-size:16px}
  .item .right .pct{font-size:11px;font-weight:800;color:#fff;background:var(--orange);border-radius:6px;padding:1px 6px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-weight:600}

  /* Barre basse : + / slider / horloge */
  .bottom{display:flex;align-items:center;gap:12px;background:var(--white);padding:12px 16px;border-top:1px solid var(--line);z-index:20}
  .round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
  .round.plus{color:var(--orange)}
  .round.clock{border:2.5px solid var(--orange);color:var(--orange)}
  .round.clock.active{background:var(--orange);color:#fff}
  .slider{flex:1;position:relative;display:flex;align-items:center;gap:8px}
  .slider input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--orange);outline:none}
  .slider input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .slider input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--orange);border:3px solid #fff}
  .slider .val{min-width:58px;font-weight:800;color:var(--orange-dark);font-size:14px;text-align:right}

  /* Tab bar */
  .tabbar{display:flex;background:var(--white);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:20}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#B5A792}
  .tabbar a.active{color:var(--orange)}
  .tabbar svg{width:24px;height:24px}

  .toast{position:absolute;top:150px;left:50%;transform:translate(-50%,-20px);background:var(--text);color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;z-index:2000;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="search" id="searchBox">
      <div class="logo">L</div>
      <input id="q" type="search" placeholder="Produit, magasin ou adresse…" autocomplete="off">
      <button class="clear" id="clearQ" aria-label="Effacer">✕</button>
    </div>

    <div class="seg" id="cats1">
      <button data-cat="all" class="active">✨ Tout</button>
      <button data-cat="tech">💻 Tech</button>
      <button data-cat="sport">👟 Sport</button>
      <button data-cat="food">🛒 Courses</button>
    </div>
    <div class="seg" id="cats2">
      <button data-cat="mode">👕 Mode</button>
      <button data-cat="beaute">💄 Beauté</button>
      <button data-cat="maison">🛋️ Maison</button>
    </div>

    <div class="chips">
      <button class="chip" id="resetBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filtres <span class="badge" id="fCount">0</span>
      </button>
      <button class="chip" data-f="student">🎓 Prix étudiant</button>
      <button class="chip" data-f="half">🔥 -50% et +</button>
      <button class="chip" data-f="soon">⏰ Finit bientôt</button>
      <button class="chip" data-f="open">🟢 Ouvert maintenant</button>
    </div>
  </header>

  <!-- MAP -->
  <main class="map-wrap">
    <div id="map"></div>

    <div class="toggle">
      <button id="vMap" class="active">Carte</button>
      <button id="vList">Liste</button>
    </div>

    <div class="list" id="list"></div>

    <button class="locate" id="locate" aria-label="Me localiser">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2711C" stroke-width="2.4"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="#F2711C"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke-linecap="round"/></svg>
    </button>

    <div class="card" id="card"></div>

    <button class="sheet" id="sheet">
      <svg class="grab" viewBox="0 0 24 24" fill="none" stroke="#3A2E22" stroke-width="2.6" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>
      <strong>Offres du moment</strong><span id="count"></span>
    </button>

    <div class="toast" id="toast"></div>
  </main>

  <!-- BARRE PRIX -->
  <div class="bottom">
    <button class="round plus" id="addDeal" aria-label="Proposer un bon plan">
      <svg width="30" height="30" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <div class="slider">
      <input type="range" id="max" min="5" max="300" step="5" value="300">
      <span class="val" id="maxVal">300+ €</span>
    </div>
    <button class="round clock" id="clockBtn" aria-label="Finit bientôt">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </div>

  <!-- TAB BAR (à relier à tes autres pages) -->
  <nav class="tabbar">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Accueil
    </a>
    <a href="#" class="active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3L3 5.5v15.5l6-2.5 6 2.5 6-2.5V3l-6 2.5z"/></svg>Carte
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12l-8 8-9-9V3h8zM7.5 6A1.5 1.5 0 107.5 9 1.5 1.5 0 007.5 6z"/></svg>Bons plans
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 012-2h13v3H5v11h15v-4h-5a2 2 0 010-4h6v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Budget
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.5 3.8-7.5 8.5-7.5s8.5 3 8.5 7.5z"/></svg>Compte
    </a>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== Offres fictives ===== */
const OFFERS = [
  {id:1, store:"Apple Store Opéra", city:"Paris", ico:"🍏", cat:"tech", product:"Écouteurs sans fil", price:89, old:149, cur:"€", lat:48.8714, lng:2.3326, addr:"12 rue Halévy, Paris 9e", endsH:5, student:true, h:[10,20]},
  {id:2, store:"Decathlon Madeleine", city:"Paris", ico:"🚲", cat:"sport", product:"Vélo de ville", price:149, old:249, cur:"€", lat:48.8702, lng:2.3240, addr:"Bd de la Madeleine, Paris 8e", endsH:48, student:false, h:[9,20]},
  {id:3, store:"Intermarché Oberkampf", city:"Paris", ico:"🛒", cat:"food", product:"Panier courses étudiant", price:15, old:25, cur:"€", lat:48.8640, lng:2.3780, addr:"Rue Oberkampf, Paris 11e", endsH:3, student:true, h:[8,21]},
  {id:4, store:"Fnac Montparnasse", city:"Paris", ico:"🎧", cat:"tech", product:"Casque Bluetooth", price:39, old:79, cur:"€", lat:48.8425, lng:2.3210, addr:"Rue de Rennes, Paris 6e", endsH:30, student:true, h:[10,20]},
  {id:5, store:"Sephora Champs-Élysées", city:"Paris", ico:"💄", cat:"beaute", product:"Coffret soin visage", price:19, old:39, cur:"€", lat:48.8712, lng:2.3030, addr:"Av. des Champs-Élysées, Paris 8e", endsH:12, student:false, h:[10,23]},
  {id:6, store:"Zara Rivoli", city:"Paris", ico:"🧥", cat:"mode", product:"Doudoune légère", price:35, old:69, cur:"€", lat:48.8608, lng:2.3445, addr:"Rue de Rivoli, Paris 1er", endsH:72, student:false, h:[10,20]},
  {id:7, store:"IKEA Paris Rivoli", city:"Paris", ico:"🪑", cat:"maison", product:"Bureau compact", price:49, old:89, cur:"€", lat:48.8568, lng:2.3555, addr:"Rue de Rivoli, Paris 4e", endsH:20, student:true, h:[10,20]},
  {id:8, store:"Carrefour City Bastille", city:"Paris", ico:"🥗", cat:"food", product:"Produits frais -50%", price:4.99, old:9.99, cur:"€", lat:48.8532, lng:2.3695, addr:"Rue de la Roquette, Paris 11e", endsH:2, student:false, h:[7,22]},
  {id:9, store:"Decathlon Lille", city:"Lille", ico:"👟", cat:"sport", product:"Chaussures running", price:29, old:59, cur:"€", lat:50.6365, lng:3.0635, addr:"Rue Neuve, Lille", endsH:26, student:true, h:[9,20]},
  {id:10, store:"Fnac Lyon Bellecour", city:"Lyon", ico:"🎮", cat:"tech", product:"Console portable", price:199, old:259, cur:"€", lat:45.7578, lng:4.8320, addr:"Rue de la République, Lyon", endsH:96, student:false, h:[10,19]},
  {id:11, store:"Intermarché Nice Centre", city:"Nice", ico:"🍕", cat:"food", product:"Lot de 3 pizzas", price:6, old:12, cur:"€", lat:43.7005, lng:7.2660, addr:"Av. Jean Médecin, Nice", endsH:8, student:true, h:[8,20]},
  {id:12, store:"Apple Store Bordeaux", city:"Bordeaux", ico:"📱", cat:"tech", product:"Tablette 10 pouces", price:299, old:389, cur:"€", lat:44.8410, lng:-0.5740, addr:"Rue Sainte-Catherine, Bordeaux", endsH:40, student:true, h:[10,20]},
  {id:13, store:"Primark Oxford Street", city:"Londres", ico:"👕", cat:"mode", product:"Sweat à capuche", price:8, old:16, cur:"£", lat:51.5150, lng:-0.1350, addr:"Oxford Street, London", endsH:15, student:false, h:[8,22]},
  {id:14, store:"Decathlon Barcelona", city:"Barcelone", ico:"🎒", cat:"sport", product:"Sac à dos 20L", price:15, old:30, cur:"€", lat:41.3870, lng:2.1700, addr:"Carrer de Canuda, Barcelona", endsH:60, student:true, h:[10,21]},
  {id:15, store:"MediaMarkt Bruxelles", city:"Bruxelles", ico:"🔊", cat:"tech", product:"Enceinte Bluetooth", price:25, old:55, cur:"€", lat:50.8466, lng:4.3528, addr:"Rue Neuve, Bruxelles", endsH:4, student:false, h:[10,19]}
];

/* ===== État ===== */
const state = {cat:"all", q:"", max:300, student:false, half:false, soon:false, open:false, view:"map", sel:null};
const saved = new Set();

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const pct = o => Math.round((1 - o.price/o.old) * 100);
const fmt = n => (n % 1 ? n.toFixed(2).replace(".", ",") : n);
const money = (n,c) => fmt(n) + " " + c;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const isOpen = o => { const h = new Date().getHours(); return h >= o.h[0] && h < o.h[1]; };
const ends = h => h < 24 ? `Finit dans ${h} h` : `Encore ${Math.round(h/24)} j`;
const CAT = {tech:"tech", sport:"sport", food:"courses alimentation", mode:"mode vetements", beaute:"beaute", maison:"maison deco"};

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function matches(o){
  if (state.cat !== "all" && o.cat !== state.cat) return false;
  if (state.max < 300 && o.price > state.max) return false;
  if (state.half && pct(o) < 50) return false;
  if (state.student && !o.student) return false;
  if (state.soon && o.endsH > 24) return false;
  if (state.open && !isOpen(o)) return false;
  if (state.q){
    const hay = norm(`${o.product} ${o.store} ${o.city} ${CAT[o.cat]}`);
    if (!hay.includes(norm(state.q))) return false;
  }
  return true;
}

/* ===== Carte (Leaflet + OpenStreetMap, marche partout dans le monde) ===== */
const map = L.map("map", {zoomControl:false}).setView([48.862, 2.345], 13);
// Fond de carte Esri (gratuit, sans clé, marche aussi en ouvrant le fichier en local)
let switched = false, tileErrors = 0;
const base = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  attribution:'Tiles © Esri', maxZoom:19
}).addTo(map);
base.on("tileerror", () => {
  if (switched || ++tileErrors < 3) return;
  switched = true;
  map.removeLayer(base);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    attribution:'Tiles © Esri', maxZoom:16
  }).addTo(map);
});
// Recalcule la taille de la carte une fois la page affichée (évite une carte vide)
window.addEventListener("load", () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 400);

const markers = {};
function pinIcon(o){
  return L.divIcon({
    className:"", iconSize:null,
    html:`<div class="pin ${state.sel === o.id ? "sel" : ""}"><span class="pp">${money(o.price,o.cur)}</span><span class="pd">-${pct(o)}%</span></div>`
  });
}
OFFERS.forEach(o => {
  markers[o.id] = L.marker([o.lat, o.lng], {icon:pinIcon(o)}).on("click", () => select(o.id));
});
map.on("click", () => select(null));

/* ===== Rendu ===== */
function render(){
  const visible = OFFERS.filter(matches);
  OFFERS.forEach(o => {
    const m = markers[o.id];
    if (visible.includes(o)) { m.setIcon(pinIcon(o)); if (!map.hasLayer(m)) m.addTo(map); }
    else if (map.hasLayer(m)) map.removeLayer(m);
  });
  if (state.sel && !visible.some(o => o.id === state.sel)) select(null);

  $("#count").textContent = `· ${visible.length} offre${visible.length > 1 ? "s" : ""}`;

  const n = ["student","half","soon","open"].filter(k => state[k]).length + (state.cat !== "all") + (state.max < 300);
  $("#fCount").textContent = n; $("#fCount").classList.toggle("show", n > 0);

  renderList(visible);
}

function renderList(visible){
  const sorted = [...visible].sort((a,b) => pct(b) - pct(a));
  $("#list").innerHTML = `<p class="list-title">Triées par meilleure réduction</p>` + (sorted.length
    ? sorted.map(o => `
      <button class="item" data-id="${o.id}">
        <div class="store-ico">${o.ico}</div>
        <div class="info"><b>${o.product}</b><small>${o.store} · ${o.city}</small></div>
        <div class="right"><span class="now">${money(o.price,o.cur)}</span><span class="pct">-${pct(o)}%</span></div>
      </button>`).join("")
    : `<p class="empty">Aucune offre avec ces filtres 😕<br>Essaie d'en enlever un.</p>`);
  document.querySelectorAll(".item").forEach(b => b.onclick = () => {
    setView("map");
    const o = OFFERS.find(x => x.id == b.dataset.id);
    map.flyTo([o.lat, o.lng], 15, {duration:.8});
    select(o.id);
  });
}

function select(id){
  const prev = state.sel; state.sel = id;
  [prev, id].forEach(x => { if (x) markers[x].setIcon(pinIcon(OFFERS.find(o => o.id === x))); });
  const card = $("#card");
  if (!id){ card.classList.remove("show"); return; }
  const o = OFFERS.find(x => x.id === id);
  const open = isOpen(o);
  card.innerHTML = `
    <button class="close" id="cClose">✕</button>
    <div class="card-top">
      <div class="store-ico">${o.ico}</div>
      <div><h3>${o.product}</h3><p class="store">${o.store}</p></div>
    </div>
    <div class="price-row">
      <span class="now">${money(o.price,o.cur)}</span>
      <span class="old">${money(o.old,o.cur)}</span>
      <span class="pct">-${pct(o)}%</span>
    </div>
    <div class="meta">
      <span class="tag ${o.endsH <= 24 ? "red" : ""}">⏰ ${ends(o.endsH)}</span>
      <span class="tag ${open ? "green" : ""}">${open ? "🟢 Ouvert" : "Fermé"} · ${o.h[0]}h-${o.h[1]}h</span>
      ${o.student ? `<span class="tag">🎓 Prix étudiant</span>` : ""}
      <span class="tag">📍 ${o.addr}</span>
    </div>
    <div class="card-actions">
      <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}">Y aller</a>
      <button class="btn ghost ${saved.has(o.id) ? "saved" : ""}" id="cSave">${saved.has(o.id) ? "❤️" : "🤍"}</button>
    </div>`;
  card.classList.add("show");
  $("#cClose").onclick = e => { e.stopPropagation(); select(null); };
  $("#cSave").onclick = () => {
    saved.has(o.id) ? saved.delete(o.id) : saved.add(o.id);
    toast(saved.has(o.id) ? "Ajouté à tes favoris" : "Retiré des favoris");
    select(o.id);
  };
}

function setView(v){
  state.view = v;
  $("#vMap").classList.toggle("active", v === "map");
  $("#vList").classList.toggle("active", v === "list");
  $("#list").classList.toggle("show", v === "list");
  if (v === "list") select(null);
}

/* ===== Événements ===== */
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  const c = b.dataset.cat;
  state.cat = (state.cat === c && c !== "all") ? "all" : c;
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("active", x.dataset.cat === state.cat));
  render();
});

document.querySelectorAll(".chip[data-f]").forEach(b => b.onclick = () => {
  const f = b.dataset.f; state[f] = !state[f];
  b.classList.toggle("active", state[f]);
  if (f === "soon") $("#clockBtn").classList.toggle("active", state.soon);
  render();
});

$("#clockBtn").onclick = () => document.querySelector('.chip[data-f="soon"]').click();

$("#resetBtn").onclick = () => {
  Object.assign(state, {cat:"all", student:false, half:false, soon:false, open:false, max:300});
  document.querySelectorAll(".chip[data-f]").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("active", x.dataset.cat === "all"));
  $("#clockBtn").classList.remove("active");
  $("#max").value = 300; $("#maxVal").textContent = "300+ €";
  render(); toast("Filtres réinitialisés");
};

$("#max").oninput = e => {
  state.max = +e.target.value;
  $("#maxVal").textContent = state.max >= 300 ? "300+ €" : `≤ ${state.max} €`;
  render();
};

const qInput = $("#q");
qInput.oninput = () => {
  state.q = qInput.value.trim();
  $("#searchBox").classList.toggle("has-text", !!state.q);
  render();
};
qInput.onkeydown = async e => {
  if (e.key !== "Enter" || !state.q) return;
  qInput.blur();
  const visible = OFFERS.filter(matches);
  if (visible.length){
    setView("map");
    map.flyToBounds(L.latLngBounds(visible.map(o => [o.lat, o.lng])).pad(.3), {maxZoom:15, duration:.8});
    return;
  }
  // Pas d'offre qui correspond : on cherche l'adresse/la ville n'importe où dans le monde
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(state.q)}`);
    const d = await r.json();
    if (!d.length) return toast("Adresse introuvable");
    state.q = ""; render(); setView("map");
    map.flyTo([+d[0].lat, +d[0].lon], 14, {duration:1});
    toast("📍 " + d[0].display_name.split(",")[0]);
  }catch(err){ toast("Recherche indisponible"); }
};
$("#clearQ").onclick = () => { qInput.value = ""; qInput.oninput(); };

$("#vMap").onclick = () => setView("map");
$("#vList").onclick = () => setView("list");
$("#sheet").onclick = () => setView(state.view === "list" ? "map" : "list");
$("#addDeal").onclick = () => toast("Proposer un bon plan : bientôt dispo ✨");

let meMarker;
$("#locate").onclick = () => map.locate({setView:true, maxZoom:14});
map.on("locationfound", e => {
  if (meMarker) map.removeLayer(meMarker);
  meMarker = L.marker(e.latlng, {icon:L.divIcon({className:"", html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8]})}).addTo(map);
});
map.on("locationerror", () => toast("Localisation refusée"));

render();
</script>
</body>
</html>
