<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2E6D3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lynx">
<title>Lynx — Assistant financier</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2E6D3;--pan:#FFFFFF;--p2:#FFF4E6;--line:#E3D6C2;--tx:#2A1C12;--mu:#806A54;--gold:#F2661B;--or:#F2661B;--mint:#2E8B57;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit;margin:0}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
h1,h2,.num{font-family:'Bricolage Grotesque',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{width:100%;height:100%;max-width:440px;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:600px){#app{height:min(100%,860px);border:1px solid var(--line);border-radius:28px}}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--or);transition:.4s}.dot.ok{background:var(--mint);box-shadow:0 0 0 4px #2e8b5733}
header h1{font-size:20px;font-weight:800;line-height:1.1}#st{font-size:13px;color:var(--mu)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}.view.on{display:flex}
.stage{position:relative;height:230px;flex:none;display:flex;justify-content:center;transition:height .5s}
.stage.sm{height:104px}
.stage:after{content:"";position:absolute;bottom:6%;width:62%;height:16%;background:radial-gradient(ellipse,#f2661b33,transparent 70%)}
canvas{height:100%;aspect-ratio:8/7;position:relative;z-index:1}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#msgs{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.welcome{align-self:center;text-align:center;opacity:0;transform:translateY(10px);transition:.7s;width:100%}.welcome.on{opacity:1;transform:none}
.hello{background:var(--pan);border:1px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:12px}
.hello small{color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;font-size:14px}.hello h2{font-size:22px;line-height:1.2;margin-top:4px}
.welcome p{color:var(--mu);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:99px;padding:9px 15px;font-weight:500;font-size:15px;white-space:nowrap;transition:.15s}
.chip:active{background:var(--p2);transform:scale(.97)}
.m{max-width:84%;padding:10px 14px;border-radius:18px;animation:in .25s}
.m.me{align-self:flex-end;background:#F2661B;color:#fff;border-bottom-right-radius:6px}
.m.ly{align-self:flex-start;background:var(--pan);border:1px solid var(--line);border-bottom-left-radius:6px}
.m .chips{justify-content:flex-start;margin-top:10px}.m .chip{padding:7px 12px;font-size:14px}
.k{margin:8px 0;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:14px;display:grid;gap:4px}
.k b{font-weight:600;color:var(--gold)}
.ty{display:flex;gap:4px;padding:14px}.ty s{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:b 1s infinite}.ty s:nth-child(2){animation-delay:.15s}.ty s:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}@keyframes in{from{opacity:0;transform:translateY(6px)}}
#quick{display:none;padding:0 16px 8px;overflow-x:auto}#quick.on{display:flex}#quick .chips{flex-wrap:nowrap}
.comp{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.comp input{flex:1;min-width:0;background:var(--pan);border:1px solid var(--line);border-radius:99px;padding:12px 18px;color:var(--tx);font:inherit}
.comp button{width:46px;height:46px;flex:none;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--pan);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
</style></head><body>
<div id="app">
<header><span class="dot" id="dot"></span><div><h1 id="ttl">Lynx</h1><div id="st">Il dort…</div></div><button class="x" id="close" aria-label="Fermer Lynx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
<main>
<section class="view on" id="v-chat">
 <div class="stage" id="stage"><canvas id="cv" width="480" height="420" aria-label="Lynx, ton assistant"></canvas></div>
 <div id="msgs"><div class="welcome" id="wel"><div class="hello"><small>Assistant Lynx</small><h2 id="hi">Bonjour ! Comment puis-je t'aider ?</h2></div><p>Pose-moi une question sur tes comptes, tes dépenses ou tes virements.</p><div class="chips qs"></div></div></div>
 <div id="quick"><div class="chips qs"></div></div>
 <div class="comp"><input id="in" placeholder="Écris à Lynx…" aria-label="Message" autocomplete="off"><button id="send" aria-label="Envoyer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
</section>
</main>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],wait=ms=>new Promise(r=>setTimeout(r,ms));
let hid=false;
const eur=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const jget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const P=jget('kapi-profile')||{pseudo:'',income:1000,monthly:100,saved:0,target:5000};
const S={inv:+P.saved||0};
const GOAL=+P.target||5000,BUD=Math.max(0,(+P.income||0)-(+P.monthly||0));
const spent=()=>Math.round((jget('kapi-budget')||{}).spent||0);
$('#hi').textContent='Bonjour'+(P.pseudo?', '+P.pseudo:'')+' ! Comment puis-je t\'aider ?';
/* --- animation : détourage de l'écran vert --- */
const v=$('#v'),cv=$('#cv'),cx=cv.getContext('2d',{willReadFrequently:true});let last=-1,onChat=true,woke=0;
function wake(){if(woke)return;woke=1;$('#wel').classList.add('on');$('#dot').classList.add('ok');$('#st').textContent='En ligne'}
function draw(){if(!hid&&onChat&&v.readyState>=2&&v.currentTime!==last){last=v.currentTime;cx.drawImage(v,0,0,480,420);const im=cx.getImageData(0,0,480,420),d=im.data;
 for(let i=0;i<d.length;i+=4){const m=d[i]>d[i+2]?d[i]:d[i+2],e=d[i+1]-m;if(e>34)d[i+3]=0;else{if(e>10)d[i+3]=255*(34-e)/24;if(e>0)d[i+1]=m}}cx.putImageData(im,0,0)}

/* --- chat --- */
const QS=['Mon solde','Dépenses du mois','Faire un virement','Mon objectif'];
$$('.qs').forEach(c=>c.innerHTML=QS.map(q=>`<button class="chip">${q}</button>`).join(''));
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;if(c.dataset.vir){virer(+c.dataset.vir,c)}else ask(c.textContent)});
function add(w,h,txt){const d=document.createElement('div');d.className='m '+w;txt?d.textContent=h:d.innerHTML=h;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d}
async function say(h){const t=add('ly','<div class="ty"><s></s><s></s><s></s></div>');await wait(750);t.innerHTML=h;$('#msgs').scrollTop=1e9}
function start(){$('#stage').classList.add('sm');$('#quick').classList.add('on')}
function ask(t){start();add('me',t,1);const s=t.toLowerCase(),sp=spent(),left=BUD-sp,days=Math.max(1,new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate()+1);
 if(s.includes('solde')){say(`Voici ton solde à cet instant :<div class="k"><span><b>Compte courant</b> ${eur((+P.income||0)-sp)}</span><span><b>Livret épargne</b> ${eur(S.inv)}</span></div>${left>=0?'Tu es sous ton budget ce mois-ci, bien joué.':'Tu as dépassé ton budget ce mois-ci, on peut regarder où ajuster.'}`)}
 else if(s.includes('dépens')){say(`Tu as dépensé ${eur(sp)} sur ${eur(BUD)} ce mois-ci.<div class="k"><span><b>Dépensé</b> ${eur(sp)}</span><span><b>Budget</b> ${eur(BUD)}</span><span><b>Reste</b> ${eur(Math.max(0,left))}</span></div>${left>0?`Soit environ ${eur(left/days)} par jour jusqu'à la fin du mois.`:'Plus de marge ce mois-ci : essaie de reporter les achats non essentiels.'}`)}
 else if(s.includes('virement')){say(`Pas de souci. Quel montant veux-tu virer vers ton livret d'épargne ?<div class="chips">${[50,100,200].map(a=>`<button class="chip" data-vir="${a}">${a} €</button>`).join('')}</div>`)}
 else if(s.includes('objectif')||s.includes('invest')){const p=Math.min(100,Math.floor(S.inv/GOAL*100)),m=+P.monthly>0?Math.ceil(Math.max(0,GOAL-S.inv)/P.monthly):null;say(`Tu as ${eur(S.inv)} de côté sur ${eur(GOAL)}, soit ${p} % de ton objectif.${m?` À ${eur(P.monthly)} par mois, il te reste environ ${m} mois.`:''}`)}
 else say(`Je peux t'aider avec ton solde, tes dépenses, tes virements ou ton objectif.`)}
function virer(a,b){b.parentElement.remove();add('me',`${a} €`,1);S.inv+=a;P.saved=S.inv;try{localStorage.setItem('kapi-profile',JSON.stringify(P))}catch(e){}
 if(parent!==window)parent.postMessage({kapi:'saved',v:S.inv},'*');say(`C'est fait : ${a} € virés vers ton livret d'épargne. Tu as maintenant ${eur(S.inv)} de côté.`)}
const send=()=>{const i=$('#in'),t=i.value.trim();if(t){i.value='';ask(t)}};$('#send').onclick=send;$('#in').onkeydown=e=>e.key=='Enter'&&send();
</script></body></html>
